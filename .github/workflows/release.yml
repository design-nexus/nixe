name: Coordinated suite release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Coordinated suite version
        required: true
        default: suite-v0.1.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare Git checkout
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: bash tools/ci-bootstrap.sh
      - run: bin/nixe dev setup
      - run: python3 tools/publish-suite.py --download-assets --tag "$RELEASE_TAG" --publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
