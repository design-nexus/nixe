name: Suite tooling
on:
  pull_request:
    paths: ['suite.toml', 'tools/**', 'bin/nixe', '.github/workflows/suite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/tests -v
      - run: bash -n bin/nixe

  integration:
    # Full cross-repository builds remain explicit to control cost and native dependencies.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Tooling prerequisites
        run: pacman -Syu --noconfirm --needed base-devel rust python git pkgconf gtk4 clang cmake ninja
      - name: Repository publication gate
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('suite.toml').read_text())
          pending = [r['name'] for r in manifest['repositories'] if r['status'] != 'published']
          if pending:
              raise SystemExit('Publish approved immutable sources before hosted integration: ' + ', '.join(pending))
          PY
      - name: Application build prerequisites
        run: |
          source <(sed -n '/^app_info()/,/^}/p' install.sh)
          mapfile -t apps < <(python3 -c 'import tomllib; print("\n".join(a["id"] for a in tomllib.load(open("suite.toml", "rb"))["applications"] if a.get("default", True)))')
          packages=()
          for app in "${apps[@]}"; do
            app_info "$app"
            packages+=($deps)
          done
          pacman -S --noconfirm --needed "${packages[@]}"
      - run: bin/nixe dev setup
      - run: bin/nixe release check --structure-only
      - run: bin/nixe dev build all
