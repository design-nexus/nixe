name: Suite tooling
on:
  pull_request:
    paths: ['suite.toml', 'tools/**', 'bin/nixe', 'install.sh', 'install-legacy.sh', 'build-environment.json', '.github/workflows/suite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: python3 -m unittest discover -s tools/tests -v
      - run: bash -n bin/nixe install.sh install-legacy.sh

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: bin/nixe dev setup
      - run: bin/nixe release check --structure-only

  integration:
    # Full cross-repository builds remain explicit to control cost and native dependencies.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Prepare Git checkout
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Tooling prerequisites
        run: bash tools/ci-bootstrap.sh
      - name: Repository publication gate
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('suite.toml').read_text())
          pending = [r['name'] for r in manifest['repositories'] if r['status'] != 'published']
          if pending:
              raise SystemExit('Publish approved immutable sources before hosted integration: ' + ', '.join(pending))
          PY
      - run: bin/nixe dev setup
      - name: Application build prerequisites
        run: |
          packages=()
          for installer in ../nixe-*/install.sh; do
            source <(sed -n '/^app_info()/,/^}/p' "$installer")
            app=$(basename "$(dirname "$installer")")
            app_info "${app#nixe-}"
            packages+=($deps)
          done
          pacman -S --noconfirm --needed "${packages[@]}"
      - run: bin/nixe release check --structure-only
      - run: bin/nixe dev build all
