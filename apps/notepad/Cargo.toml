[package]
name = "nixe-notepad"
version = "0.1.0"
description = "A plain-text notepad for Omarchy with tabs, adjustable fonts and sessions that keep unsaved text"
license = "MIT"
repository = "https://github.com/design-nexus/nixe"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-notepad"
path = "src/main.rs"

[dependencies]
nixe-core = { path = "../../crates/nixe-core" }
nixe-ui = { path = "../../crates/nixe-ui" }
nixe-theme = { path = "../../crates/nixe-theme" }
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
