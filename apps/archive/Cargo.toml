[package]
name = "nixe-archive"
version = "0.1.0"
description = "A 7-Zip archive manager for Omarchy: browse, extract and create archives"
license = "MIT"
repository = "https://github.com/design-nexus/nixe"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-archive"
path = "src/main.rs"

[dependencies]
nixe-core = { path = "../../crates/nixe-core" }
nixe-ui = { path = "../../crates/nixe-ui" }
nixe-theme = { path = "../../crates/nixe-theme" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
