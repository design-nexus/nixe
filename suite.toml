# Supported standalone suite release. The pre-split monorepo source is in this
# repository's history at `baseline` (the rollback point); it is no longer on main.
schema_version = 1
baseline = "97c1899499e52a42f6eaddca188aac4eca32b96e"

[compatibility]
gtk = ">=4.18"
python = ">=3.11"
control_interface = "io.github.design_nexus.nyx.Control"
passwords_interface = "io.github.design_nexus.nyx.Passwords1"
plugin_contract = "existing glimpse-plugin-sdk handshake; changes require affected-consumer checks"
database_contracts = ["News/Capture read-only Glimpse access: preserve current schema until versioned"]
tested_target = "x86_64-unknown-linux-gnu"
# Source-worktree contracts; published artifact revisions below are unchanged.
development_contracts = [
  "Notes Control v1: opt-in vault reads and reviewed edit proposals/status; existing Control D-Bus signatures unchanged",
  "Assistant model API v1: correlated local generation and opt-in loopback embeddings; existing socket commands unchanged",
  "Glimpse Notes profile v1: opt-in read-only launcher.sqlite export and validated Notes host actions; SDK handshake unchanged",
]

